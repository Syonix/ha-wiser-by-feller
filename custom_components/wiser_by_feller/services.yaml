status_light:
  description: Set device status light
  fields:
    device:
      required: true
      selector:
        device:
          filter:
            - integration: wiser_by_feller
    color:
      required: true
      default:
        - 26
        - 188
        - 242
      selector:
        color_rgb:
    color_off:
      required: false
      selector:
        color_rgb:
    channel:
      required: true
      default: "0"
      selector:
        select:
          translation_key: "select_channel"
          options: ["0", "1", "2", "3"]
    brightness_on:
      required: true
      default: 100
      selector:
        number:
          min: 0
          max: 100
    brightness_off:
      required: false
      selector:
        number:
          min: 0
          max: 100

set_button_led_override:
  name: Set Button LED Override
  description: Set a temporary LED override on a Wiser button LED.
  fields:
    config_entry_id:
      name: µGateway
      description: The µGateway the button belongs to. Optional if you only have one; required when multiple µGateways are configured.
      required: false
      selector:
        config_entry:
          integration: wiser_by_feller

    button_id:
      name: Button ID
      description: Wiser button ID. Use the `find_button` service to discover it.
      required: true
      selector:
        number:
          min: 0
          mode: box

    led_index:
      name: LED
      description: Which LED to control on the button.
      required: true
      default: "0"
      selector:
        select:
          translation_key: "select_led_index"
          options: ["0", "1"]

    rgb_color:
      name: RGB Color
      description: LED color.
      required: true
      default:
        - 26
        - 188
        - 242
      selector:
        color_rgb:

    effect:
      name: Effect
      description: LED blink pattern.
      required: false
      default: permanent
      selector:
        select:
          options:
            - permanent
            - ramp
            - ramp_up
            - ramp_down
            - slow
            - fast

clear_button_led_override:
  name: Clear Button LED Override
  description: Disable the temporary LED override and return to the configured Wiser LED behavior.
  fields:
    config_entry_id:
      name: µGateway
      description: The µGateway the button belongs to. Optional if you only have one; required when multiple µGateways are configured.
      required: false
      selector:
        config_entry:
          integration: wiser_by_feller

    button_id:
      name: Button ID
      description: Wiser button ID. Use the Find Button service to discover it.
      required: true
      selector:
        number:
          min: 0
          mode: box

    led_index:
      name: LED
      description: Which LED to control on the button.
      required: true
      default: "0"
      selector:
        select:
          translation_key: "select_led_index"
          options: ["0", "1"]

find_button:
  name: Find Button
  description: >
    Activates find-me mode on all buttons. All button LEDs start blinking.
    Press any physical button to identify it. The button ID, device, channel,
    label, and LED options are returned as the service response and shown as a notification.
  fields:
    config_entry_id:
      name: µGateway
      description: The µGateway to activate find-me mode on. Optional if you only have one; required when multiple µGateways are configured.
      required: false
      selector:
        config_entry:
          integration: wiser_by_feller

    register_unmanaged:
      name: Register unmanaged button
      description: >
        If the pressed button is not yet registered on the µGateway, register it
        automatically and return its new button ID. Requires µGateway firmware 6.0.42+.
        Note that button management is a beta feature of the µGateway firmware —
        only register buttons you actually need, as too many registered buttons
        can slow the gateway down.
      required: false
      default: false
      selector:
        boolean:

register_button:
  name: Register Button
  description: >
    Register an available (sleeping) physical button on the µGateway so it gets
    a button ID and starts emitting button events. Requires µGateway firmware 6.0.42+.
    Note that button management is a beta feature of the µGateway firmware — only
    register buttons you actually need, as too many registered buttons can slow
    the gateway down.
  fields:
    config_entry_id:
      name: µGateway
      description: The µGateway to register the button on. Optional if you only have one; required when multiple µGateways are configured.
      required: false
      selector:
        config_entry:
          integration: wiser_by_feller

    device:
      name: Device
      description: Gateway device reference (e.g. `0000a98f`). Use the Find Button service to discover it.
      required: true
      selector:
        text:

    channel:
      name: Channel
      description: Input channel of the button on the device.
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 7
          mode: box

unregister_button:
  name: Unregister Button
  description: >
    Remove a registered button from the µGateway. It stops emitting button
    events and its LEDs are turned off. Requires µGateway firmware 6.0.42+.
  fields:
    config_entry_id:
      name: µGateway
      description: The µGateway the button belongs to. Optional if you only have one; required when multiple µGateways are configured.
      required: false
      selector:
        config_entry:
          integration: wiser_by_feller

    button_id:
      name: Button ID
      description: Wiser button ID. Use the Find Button service to discover it.
      required: true
      selector:
        number:
          min: 0
          mode: box
